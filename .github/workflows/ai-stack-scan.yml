name: AI Stack and Risk Scan

on:
  push:
    branches:
      - main
    paths-ignore:
      - "AI_STACK.md"
      - "ai-stack-report.json"
      - "AI_RISK_REPORT.md"
      - "ai-risk-report.json"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  update-ai-reports:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout CrewAI
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run AI stack and risk scan
        uses: nitishb-solytics/AI-STACK-MAPPER@main
        with:
          path: "."
          mode: "both"

          scanner-mode: "hybrid"
          markdown-output: "AI_STACK.md"
          json-output: "ai-stack-report.json"
          enrich: "false"

          risk-output: "AI_RISK_REPORT.md"
          risk-json-output: "ai-risk-report.json"
          risk-no-fail: "true"

          llm-risk-control: "true"
          risk-llm-max-findings: "25"
          risk-llm-min-severity: "high"
          llm-api-key: ${{ secrets.AI_STACK_LLM_API_KEY }}
          llm-base-url: "https://openrouter.ai/api/v1"
          llm-model: "google/gemma-4-26b-a4b-it:free"

      - name: Validate reports
        shell: bash
        run: |
          test -s AI_STACK.md
          test -s ai-stack-report.json
          test -s AI_RISK_REPORT.md
          test -s ai-risk-report.json
          python -m json.tool ai-stack-report.json > /dev/null
          python -m json.tool ai-risk-report.json > /dev/null

      - name: Commit updated reports
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add AI_STACK.md ai-stack-report.json AI_RISK_REPORT.md ai-risk-report.json

          if git diff --cached --quiet; then
            echo "No AI stack/risk report changes detected."
            exit 0
          fi

          git commit -m "chore: update AI stack and risk reports"
          git push

  pr-risk-quality-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout CrewAI
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run PR risk quality gate
        uses: nitishb-solytics/AI-STACK-MAPPER@main
        with:
          path: "."
          mode: "risk"
          changed-only: "true"
          base-ref: ${{ github.base_ref }}
          fail-on: "high"

          risk-output: "AI_RISK_REPORT.md"
          risk-json-output: "ai-risk-report.json"

          llm-risk-control: "true"
          risk-llm-max-findings: "25"
          risk-llm-min-severity: "high"
          llm-api-key: ${{ secrets.AI_STACK_LLM_API_KEY }}
          llm-base-url: "https://openrouter.ai/api/v1"
          llm-model: "google/gemma-4-26b-a4b-it:free"

      - name: Validate PR risk report
        if: always()
        shell: bash
        run: |
          test -s AI_RISK_REPORT.md
          test -s ai-risk-report.json
          python -m json.tool ai-risk-report.json > /dev/null

      - name: Upload PR risk report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-risk-report
          path: |
            AI_RISK_REPORT.md
            ai-risk-report.json
          if-no-files-found: error